<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your Vertix Trade account.">
  <link rel="icon" href="assets/vertix-trade-mark.png" type="image/png">
  <title>Sign in | Vertix Trade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/superphase.css">
</head>
<body class="auth-body">
  <div class="site-backdrop"></div><div class="noise"></div>
  <main class="auth-wrap">
    <div class="auth-card glass-panel">
      <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/vertix-trade-mark.png" alt=""></span><span>VERTIX<span class="brand-light"> TRADE</span></span></a>
      <div class="auth-heading">
        <div class="eyebrow"><span class="pulse-dot"></span> Member access</div>
        <h1>Welcome back.</h1>
        <p>Sign in to your Vertix Trade account.</p>
      </div>
      <form class="auth-form" id="login-form" method="post">
        <label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label>
        <p class="form-status" aria-live="polite"></p>
        <button class="button button-primary" type="submit">Sign in <span>↗</span></button>
      </form>
      <p class="auth-switch">New to Vertix Trade? <a href="register.html">Create an account</a></p>
      <p class="auth-note">Email verification is required to access your account.</p>
    </div>
    <a class="back-home" href="index.html">← Back to Vertix Trade</a>
  </main>
  <script type="module" src="js/app.js"></script>
  <script src="https://code-jvs.jivosite.com/widget/iZl6J4O0yO" async></script>
</body>
</html>
