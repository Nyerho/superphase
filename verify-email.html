<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Verify the email address on your Vertix Trade account.">
  <link rel="icon" href="assets/vertix-trade-mark.png" type="image/png">
  <title>Verify email | Vertix Trade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/superphase.css">
</head>
<body class="auth-body">
  <div class="site-backdrop"></div><div class="noise"></div>
  <main class="auth-wrap">
    <section class="auth-card glass-panel">
      <a class="brand" href="index.html"><span class="brand-mark"><img src="assets/vertix-trade-mark.png" alt=""></span><span>VERTIX<span class="brand-light"> TRADE</span></span></a>
      <div class="auth-heading">
        <div class="eyebrow"><span class="pulse-dot"></span> Account security</div>
        <h1>Verify your email.</h1>
        <p>Open the verification link sent to your email address. Once verified, return here to continue.</p>
      </div>
      <div class="auth-form">
        <p class="form-status" data-verification-status aria-live="polite"></p>
        <button class="button button-primary" type="button" data-resend-verification>Resend verification email</button>
        <button class="button button-quiet" type="button" data-check-verification>I've verified my email</button>
      </div>
      <p class="auth-switch">Need to use another account? <a href="login.html">Sign in</a></p>
    </section>
    <a class="back-home" href="index.html">← Back to Vertix Trade</a>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
